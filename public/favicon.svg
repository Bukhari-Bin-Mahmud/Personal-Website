<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Vibrant, high-contrast neon orange gradient -->
    <linearGradient id="neonFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Transform to perfectly center and scale the logo, leaving room for the thick outline -->
  <g transform="translate(5, 7.25) scale(0.9)" 
     fill="url(#neonFill)" 
     stroke="#1a1815" 
     stroke-width="6" 
     stroke-linejoin="round" 
     stroke-linecap="round">
     
    <!-- Top Parallelogram -->
    <polygon points="17.5,35 27.5,25 27.5,0 17.5,10" />
    
    <!-- Main Sweeping 'b' Shape -->
    <path d="M 17.5 60 
             L 17.5 45 
             L 27.5 35 
             L 52.5 35 
             A 30 30 0 0 1 52.5 95 
             L 17.5 95 
             L 27.5 85 
             L 52.5 85 
             A 20 20 0 0 0 52.5 45 
             L 27.5 45 
             L 17.5 55 
             Z" />
  </g>
</svg>
