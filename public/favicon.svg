<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solid Orange Base Diamond -->
  <!-- We use a solid base to prevent any microscopic gaps between shapes -->
  <polygon points="50,10 90,50 50,90 10,50" fill="#ea580c" />
  
  <!-- The Black Shapes drawn precisely on top to create the alternating geometry -->
  <g fill="#1a1815">
    <!-- Top-Left Inner Circle Cut -->
    <path d="M 50 50 L 50 30 A 20 20 0 0 0 30 50 Z" />
    
    <!-- Top-Right Outer Chevron -->
    <path d="M 50 10 L 90 50 L 70 50 A 20 20 0 0 0 50 30 Z" />
    
    <!-- Bottom-Right Inner Circle Cut -->
    <path d="M 50 50 L 70 50 A 20 20 0 0 1 50 70 Z" />
    
    <!-- Bottom-Left Outer Chevron -->
    <path d="M 50 90 L 10 50 L 30 50 A 20 20 0 0 0 50 70 Z" />
  </g>
</svg>
