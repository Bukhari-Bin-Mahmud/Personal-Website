<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Vibrant Orange Gradient to give it a glowing, premium feel -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Filled Geometric Regions (Abstract Checkerboard Inversion) -->
  <g fill="url(#neonOrange)" fill-rule="evenodd">
    <!-- Top-Left Outer Chevron -->
    <path d="M 50 10 L 50 50 L 10 50 Z M 50 30 L 50 50 L 30 50 Z" />
    
    <!-- Bottom-Right Outer Chevron -->
    <path d="M 50 50 L 90 50 L 50 90 Z M 50 50 L 70 50 L 50 70 Z" />
    
    <!-- Top-Right Inner Triangle -->
    <polygon points="50,30 70,50 50,50" />
    
    <!-- Bottom-Left Inner Triangle -->
    <polygon points="30,50 50,50 50,70" />
  </g>

  <!-- Thick Dark Charcoal Outlines for stark contrast and brutalist structure -->
  <g fill="none" stroke="#1a1815" stroke-width="5" stroke-linejoin="miter">
    <!-- Outer Diamond -->
    <polygon points="50,10 90,50 50,90 10,50" />
    
    <!-- Inner Diamond -->
    <polygon points="50,30 70,50 50,70 30,50" />
    
    <!-- Vertical Structural Axis -->
    <line x1="50" y1="10" x2="50" y2="90" />
    
    <!-- Horizontal Structural Axis -->
    <line x1="10" y1="50" x2="90" y2="50" />
  </g>
</svg>
