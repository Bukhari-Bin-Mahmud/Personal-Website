<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Vibrant orange gradient -->
    <linearGradient id="neonFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Base sword design -->
    <g id="sword">
      <!-- Blade -->
      <path d="M42,20 L50,5 L58,20 L58,70 L42,70 Z" />
      <!-- Crossguard -->
      <rect x="22" y="70" width="56" height="8" rx="3" />
      <!-- Handle -->
      <rect x="42" y="78" width="16" height="16" />
      <!-- Pommel -->
      <circle cx="50" cy="95" r="7" />
    </g>
  </defs>

  <!-- Scale and center the crossed swords perfectly in the view box -->
  <g transform="translate(50,50) scale(1.3) translate(-50,-50)">
    
    <!-- Crossed swords with thick dark outline -->
    <g stroke="#1a1815" stroke-width="4" stroke-linejoin="round" fill="url(#neonFill)">
      <use href="#sword" transform="rotate(45 50 50)" />
      <use href="#sword" transform="rotate(-45 50 50)" />
    </g>
    
    <!-- Blood grooves (fullers) for extra crispy detail -->
    <g fill="#1a1815">
      <rect x="48.5" y="25" width="3" height="42" rx="1.5" transform="rotate(45 50 50)" />
      <rect x="48.5" y="25" width="3" height="42" rx="1.5" transform="rotate(-45 50 50)" />
    </g>
  </g>
</svg>
