<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Mask for perfect transparent cutouts in the center of the loops -->
    <mask id="holes">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <circle cx="55" cy="35" r="8" fill="black" />
      <circle cx="60" cy="65" r="10" fill="black" />
    </mask>
    
    <!-- Vibrant gradients for a modern, creative look -->
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    
    <linearGradient id="gradGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>
  
  <g mask="url(#holes)">
    <!-- Top Loop (Rose Gradient) -->
    <circle cx="55" cy="35" r="22" fill="url(#gradPink)" opacity="0.9" />
    <!-- Bottom Loop (Gold Gradient) -->
    <circle cx="60" cy="65" r="26" fill="url(#gradGold)" opacity="0.9" />
    <!-- Main Stem (Vibrant Orange Gradient) -->
    <rect x="25" y="15" width="20" height="70" rx="10" fill="url(#gradOrange)" opacity="0.95" />
  </g>
</svg>
