<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- A stunning, fiery sunset gradient -->
    <linearGradient id="sunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" /> <!-- Golden yellow -->
      <stop offset="50%" stop-color="#ea580c" /> <!-- Vibrant orange -->
      <stop offset="100%" stop-color="#be123c" /> <!-- Deep rose -->
    </linearGradient>
  </defs>
  
  <!-- Disconnected, highly abstract stencil lines -->
  <g fill="none" stroke="url(#sunset)" stroke-width="16" stroke-linecap="round">
    <!-- The vertical stem -->
    <line x1="24" y1="15" x2="24" y2="85" />
    
    <!-- The top loop -->
    <path d="M 44,15 C 80,15 80,40 44,40" />
    
    <!-- The bottom loop (slightly wider) -->
    <path d="M 44,60 C 92,60 92,85 44,85" />
  </g>
</svg>
